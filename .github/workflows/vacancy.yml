name: Update VIALA vacancy data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches:
      - main
    paths:
      - 'config.json'
      - 'package.json'
      - 'src/**'
      - '.github/workflows/vacancy.yml'

permissions:
  contents: write

concurrency:
  group: viala-vacancy-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Retrieve vacancy data
        run: npm run probe

      - name: Build public data
        run: npm run publish-data

      - name: Commit public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No public data changes"
          else
            git commit -m "Update public vacancy data"
            git push
          fi
