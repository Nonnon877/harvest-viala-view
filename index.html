<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f766e">
<title>VIALA 空室情報</title>
<style>
:root{--bg:#f3f7f6;--card:#fff;--ink:#18312e;--muted:#647773;--accent:#0f766e;--line:#dce8e5;--good:#087f5b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.65}main{width:min(920px,calc(100% - 28px));margin:14px auto 64px}.hero{padding:24px 20px;border-radius:24px;background:linear-gradient(135deg,#0f766e,#115e59);color:#fff;box-shadow:0 14px 35px rgba(15,118,110,.18)}h1{margin:0 0 8px;font-size:clamp(25px,6vw,40px);line-height:1.25}.hero p{margin:0;opacity:.9}.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0}.metric,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 5px 18px rgba(30,65,59,.05)}.metric{padding:17px}.metric span{display:block;color:var(--muted);font-size:13px}.metric strong{display:block;margin-top:3px;font-size:21px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.button{border:0;border-radius:14px;padding:13px 18px;font:inherit;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#fff;color:var(--accent);border:1px solid var(--line)}button:disabled{opacity:.55;cursor:wait}.hint{margin:0 0 16px;color:var(--muted);font-size:13px}.status{margin:0 0 16px;padding:12px 14px;border-radius:12px;background:#e6fcf5;color:#086b50;display:none}.status.error{background:#fff0ed;color:#b42318}.progress-box{display:none;align-items:center;gap:12px;margin:0 0 16px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}.progress-box.active{display:flex}.spinner{width:24px;height:24px;border:3px solid #cfe3df;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex:0 0 auto}.progress-text strong{display:block}.progress-text span{color:var(--muted);font-size:13px}@keyframes spin{to{transform:rotate(360deg)}}.filter-section{margin:0 0 12px}.filter-label{display:block;margin:0 0 6px;color:var(--muted);font-size:13px;font-weight:700}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px;background:#e7efed;border-radius:16px}.filter-button{border:0;border-radius:12px;padding:11px 8px;background:transparent;color:var(--muted);font:inherit;font-weight:700;cursor:pointer}.filter-button.active{background:#fff;color:var(--accent);box-shadow:0 2px 8px rgba(30,65,59,.08)}.tab-strip{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:thin}.tab-button{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:9px 13px;font:inherit;font-weight:700;cursor:pointer}.tab-button.active{background:var(--accent);color:#fff;border-color:var(--accent)}.card{padding:22px;margin-top:16px}.card h2{margin:0 0 14px;font-size:19px}.empty{text-align:center;padding:28px 12px}.empty strong{display:block;font-size:20px;margin:5px 0}.empty p{margin:0;color:var(--muted)}.slot{padding:18px 0;border-top:1px solid var(--line)}.slot:first-child{border-top:0}.slot-head{display:flex;justify-content:space-between;gap:12px}.slot h3{margin:0;font-size:18px}.badge{white-space:nowrap;background:#e6fcf5;color:var(--good);font-weight:700;border-radius:999px;padding:4px 10px;font-size:13px}.ticket-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.ticket-chip{display:inline-block;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;background:#eef5f3;color:#315e57}.details{margin:10px 0 0;padding:0;list-style:none;color:var(--muted);font-size:14px}.details b{color:var(--ink)}footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px}dialog{width:min(420px,calc(100% - 32px));border:0;border-radius:18px;padding:0;box-shadow:0 24px 70px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(12,31,28,.48)}.dialog-body{padding:24px}.dialog-body h2{margin:0 0 8px;font-size:22px}.dialog-body p{margin:0 0 18px;color:var(--muted)}.dialog-actions{display:flex;justify-content:flex-end}.dialog-actions button{min-width:120px}@media(max-width:650px){.summary{grid-template-columns:1fr}.metric{display:flex;justify-content:space-between;align-items:center}.metric strong{margin:0;font-size:18px}.actions{display:grid}.button{width:100%}}
</style>
</head>
<body><main>
<section class="hero"><h1>HVC券で予約可能なVIALA空室</h1><p>ホーム券または相互利用券で予約できる、最大2か月先までの空室を表示します。</p></section>
<section class="summary"><div class="metric"><span>最終更新</span><strong id="updated">読込中</strong></div><div class="metric"><span>表示中の枠</span><strong id="count">—</strong></div></section>
<div class="actions"><button id="refresh" class="button primary" type="button">↻ 最新データを取得</button><button id="reload" class="button secondary" type="button">ページを再読み込み</button></div>
<p class="hint">更新開始後は完了を自動確認し、新しいデータが公開されたらメッセージを表示して再読み込みします。</p>
<div id="progressBox" class="progress-box" aria-live="polite"><div class="spinner" aria-hidden="true"></div><div class="progress-text"><strong>最新データを取得中</strong><span id="progressDetail">処理を開始しています…</span></div></div>
<p id="actionStatus" class="status" aria-live="polite"></p>
<div class="filter-section"><span class="filter-label">利用券</span><div class="filters" role="group" aria-label="利用券で絞り込み"><button class="filter-button ticket-filter active" type="button" data-filter="all">すべて</button><button class="filter-button ticket-filter" type="button" data-filter="home">ホーム券</button><button class="filter-button ticket-filter" type="button" data-filter="mutual">相互券</button></div></div>
<div class="filter-section"><span class="filter-label">ペット可否</span><div class="filters" role="group" aria-label="ペット可否で絞り込み"><button class="filter-button room-filter active" type="button" data-room-filter="all">すべて</button><button class="filter-button room-filter" type="button" data-room-filter="pet">🐶 ペットルーム</button><button class="filter-button room-filter" type="button" data-room-filter="regular">一般客室</button></div></div>
<div class="filter-section"><span class="filter-label">施設</span><div id="facilityTabs" class="tab-strip" role="tablist" aria-label="施設を選択"></div></div>
<div class="filter-section"><span class="filter-label">部屋タイプ</span><div id="roomTabs" class="tab-strip" role="tablist" aria-label="部屋タイプを選択"></div></div>
<section class="card"><h2 id="listTitle">すべての空室</h2><div id="results" aria-live="polite">読み込んでいます…</div></section><footer>予約状況は変動します。最終的な空室・料金は予約画面で確認してください。</footer>
</main>
<dialog id="completeDialog"><div class="dialog-body"><h2>更新が完了しました</h2><p id="completeMessage">最新の空室データを取得しました。</p><div class="dialog-actions"><button id="completeOk" class="button primary" type="button">最新情報を表示</button></div></div></dialog>
<script>
const ENDPOINT='https://harvest-viala-trigger.niya-tsukushi.workers.dev';
const esc=(v='')=>String(v).replace(/[&<>\'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const yen=n=>Number.isFinite(n)?new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(n):'—';
const statusBox=document.getElementById('actionStatus');
const progressBox=document.getElementById('progressBox');
const progressDetail=document.getElementById('progressDetail');
const completeDialog=document.getElementById('completeDialog');
let allSlots=[];let activeFilter='all';let activeRoomFilter='all';let activeFacility='all';let activeRoom='all';let currentUpdatedAt='';
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function showStatus(message,error=false){statusBox.textContent=message;statusBox.className=error?'status error':'status';statusBox.style.display='block'}
function setProgress(active,detail=''){progressBox.classList.toggle('active',active);if(detail)progressDetail.textContent=detail}
function matchesTicketFilter(slot){const available=Array.isArray(slot.usableTickets)?slot.usableTickets:[];if(activeFilter==='home')return available.some(x=>x.includes('ホーム券'));if(activeFilter==='mutual')return available.some(x=>x.includes('相互利用券'));return true}
function matchesPetFilter(slot){if(activeRoomFilter==='pet')return slot.pet===true;if(activeRoomFilter==='regular')return slot.pet!==true;return true}
function baseFiltered(){return allSlots.filter(x=>matchesTicketFilter(x)&&matchesPetFilter(x))}
function renderFacilityTabs(){const facilities=[...new Set(baseFiltered().map(x=>x.facility).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));if(activeFacility!=='all'&&!facilities.includes(activeFacility)){activeFacility='all';activeRoom='all'}facilityTabs.innerHTML=[`<button class="tab-button ${activeFacility==='all'?'active':''}" type="button" data-facility="all">すべて</button>`,...facilities.map(f=>`<button class="tab-button ${activeFacility===f?'active':''}" type="button" data-facility="${esc(f)}">${esc(f)}</button>`)].join('');facilityTabs.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{activeFacility=b.dataset.facility;activeRoom='all';renderAll()}))}
function renderRoomTabs(){const source=baseFiltered().filter(x=>activeFacility==='all'||x.facility===activeFacility);const rooms=[...new Set(source.map(x=>x.room).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));if(activeRoom!=='all'&&!rooms.includes(activeRoom))activeRoom='all';roomTabs.innerHTML=[`<button class="tab-button ${activeRoom==='all'?'active':''}" type="button" data-room="all">すべて</button>`,...rooms.map(r=>`<button class="tab-button ${activeRoom===r?'active':''}" type="button" data-room="${esc(r)}">${esc(r)}</button>`)].join('');roomTabs.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{activeRoom=b.dataset.room;renderSlots()}))}
function selectedSlots(){return baseFiltered().filter(x=>(activeFacility==='all'||x.facility===activeFacility)&&(activeRoom==='all'||x.room===activeRoom))}
function renderSlots(){const slots=selectedSlots();count.textContent=`${slots.length}件`;const parts=[];if(activeFacility!=='all')parts.push(activeFacility);if(activeRoom!=='all')parts.push(activeRoom);listTitle.textContent=parts.length?`${parts.join('／')}の空室`:'すべての空室';if(!slots.length){results.innerHTML='<div class="empty"><strong>条件に合う空室はありません</strong><p>施設・部屋タイプ・券の条件を切り替えてください。</p></div>';return}results.innerHTML=slots.map(x=>{const chips=(x.usableTickets||[]).map(t=>`<span class="ticket-chip">${esc(t)}</span>`).join('');return `<article class="slot"><div class="slot-head"><h3>${x.pet?'🐶 ':''}${esc(x.facility)}｜${esc(x.date)}</h3><span class="badge">${x.status==='few'?'残りわずか':'空室'}</span></div><div class="ticket-badges">${chips}</div><ul class="details"><li>部屋：<b>${esc(x.room)}</b></li><li>相互利用料金：<b>${yen(x.mutualPriceYen)}</b></li><li>定員：標準${esc(x.standardCapacity??'—')}名／最大${esc(x.maxCapacity??'—')}名${x.areaSqm?`・${esc(x.areaSqm)}㎡`:''}</li><li>判定：${esc(x.notes||'通常日')}</li></ul></article>`}).join('')}
function renderAll(){renderFacilityTabs();renderRoomTabs();renderSlots();document.querySelectorAll('.ticket-filter').forEach(b=>{const a=b.dataset.filter===activeFilter;b.classList.toggle('active',a);b.setAttribute('aria-pressed',String(a))});document.querySelectorAll('.room-filter').forEach(b=>{const a=b.dataset.roomFilter===activeRoomFilter;b.classList.toggle('active',a);b.setAttribute('aria-pressed',String(a))})}
async function fetchData(){const r=await fetch(`./data.json?t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}
async function loadData(){const data=await fetchData();allSlots=Array.isArray(data.slots)?data.slots:[];currentUpdatedAt=data.updatedAt||'';updated.textContent=currentUpdatedAt||'不明';renderAll()}
async function waitForPublishedUpdate(previousUpdatedAt){const started=Date.now();const timeout=10*60*1000;while(Date.now()-started<timeout){await sleep(10000);const elapsed=Math.floor((Date.now()-started)/1000);setProgress(true,`公開データの更新を確認中です（${elapsed}秒経過）`);try{const data=await fetchData();if(data.updatedAt&&data.updatedAt!==previousUpdatedAt)return data}catch(e){}}throw new Error('10分以内に新しいデータを確認できませんでした。')}
loadData().catch(e=>{results.innerHTML=`<div class="status error" style="display:block">データを読み込めませんでした：${esc(e.message)}</div>`;updated.textContent='取得失敗'});
document.querySelectorAll('.ticket-filter').forEach(b=>b.addEventListener('click',()=>{activeFilter=b.dataset.filter;activeFacility='all';activeRoom='all';renderAll()}));
document.querySelectorAll('.room-filter').forEach(b=>b.addEventListener('click',()=>{activeRoomFilter=b.dataset.roomFilter;activeFacility='all';activeRoom='all';renderAll()}));
document.getElementById('reload').addEventListener('click',()=>location.reload());
document.getElementById('completeOk').addEventListener('click',()=>location.reload());
document.getElementById('refresh').addEventListener('click',async()=>{let key=sessionStorage.getItem('harvestRefreshKey');if(!key){key=prompt('更新用の合言葉を入力してください');if(!key)return;sessionStorage.setItem('harvestRefreshKey',key)}const button=document.getElementById('refresh');button.disabled=true;statusBox.style.display='none';setProgress(true,'GitHub Actionsを起動しています…');try{const before=currentUpdatedAt;const r=await fetch(ENDPOINT,{method:'POST',headers:{'x-refresh-key':key}});const body=await r.json().catch(()=>({}));if(!r.ok)throw new Error(body.error||`HTTP ${r.status}`);setProgress(true,'空室データを取得しています…');const data=await waitForPublishedUpdate(before);setProgress(false);document.getElementById('completeMessage').textContent=`最新データ（${data.updatedAt}）を取得しました。`;completeDialog.showModal()}catch(e){setProgress(false);sessionStorage.removeItem('harvestRefreshKey');showStatus(`取得できませんでした：${e.message}`,true)}finally{button.disabled=false}});
</script></body></html>
